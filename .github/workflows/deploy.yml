name: Deploy Svelte-POC to GitHub Pages

on:
  push:
    branches:
      - svelte-master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install dependencies
        working-directory: Svelte-POC 
        run: npm install

      - name: Build project
        working-directory: Svelte-POC  
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: Svelte-POC/dist/ 
          publish_branch: gh-pages
          destination_dir: svelte-master 
